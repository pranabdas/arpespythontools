name: Python tests
on:
  push:
    branches:
      - main
    paths: &monitor_paths
      - .github/workflows/python-tests.yml
      - poetry.lock
      - pyproject.toml
      - src/arpespythontools/**
      - tests/**
  pull_request:
    branches:
      - main
    paths: *monitor_paths

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install --upgrade poetry

      - name: Install dependencies
        run: poetry install

      - name: Run unittest
        run: poetry run python -m unittest discover tests
