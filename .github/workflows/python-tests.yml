name: Python tests
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/python-tests.yml
      - poetry.lock
      - pyproject.toml
      - src/arpespythontools/**
      - tests/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/python-tests.yml
      - poetry.lock
      - pyproject.toml
      - src/arpespythontools/**
      - tests/**

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install --upgrade poetry

      - name: Install dependencies
        run: poetry install

      - name: Run unittest
        run: poetry run python -m unittest discover tests
